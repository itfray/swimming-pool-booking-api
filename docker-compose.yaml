services:
  postgres:
    image: postgres:15-alpine
    container_name: pool-booking-postgres
    environment:
      POSTGRES_DB: plbk
      POSTGRES_USER: plbk
      POSTGRES_PASSWORD: plbk
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "15432:5432"
    volumes:
      - poolbooking_db:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plbk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poolbooking-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: pool-booking-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - poolbooking_keycloak:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
    command: ["start-dev", "--import-realm"]
    networks:
      - poolbooking-network

volumes:
  poolbooking_db:
    driver: local
  poolbooking_keycloak:
    driver: local

networks:
  poolbooking-network:
    driver: bridge
