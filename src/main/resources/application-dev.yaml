  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-secret: ${KEYCLOAK_CLIENT_SECRET:LbLkIIODlKOPM1inpn9um9rYQGk9NLMAzoCRiEHB8wdRhmaRFWhRV4JC4vozz2JbdFzgAfVl5T4dgYD2ifU9WV}
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18081/realms/pool-booking}

logging:
  level:
    root: INFO
    pro.itfray: DEBUG
