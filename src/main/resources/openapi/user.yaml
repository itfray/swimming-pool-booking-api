openapi: 3.0.3
info:
  title: User API
  version: 1.0.0
  description: User management endpoints
servers:
  - url: http://localhost:8080
tags:
  - name: User
    description: User API
paths:
  /v1/users:
    post:
      tags:
        - User
      summary: Create user
      operationId: createUser
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '401':
          description: Unauthorized
  /v1/users/{id}:
    get:
      tags:
        - User
      summary: Get user by id
      operationId: getUser
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User identifier
          example: "a4c7e2d6-e7f7-4323-8360-466f1f5c5e26"
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '404':
          description: User not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserProfileDto:
      type: object
      required:
        - uid
        - theme
        - hasOrganization
      properties:
        uid:
          type: string
          format: uuid
          example: "a4c7e2d6-e7f7-4323-8360-466f1f5c5e26"
        username:
          type: string
          nullable: true
          example: "john-doe"
        email:
          type: string
          nullable: true
          example: "john.doe@example.com"
        firstName:
          type: string
          nullable: true
          example: "John"
        lastName:
          type: string
          nullable: true
          example: "Doe"
        theme:
          type: string
          example: WHITE
        hasOrganization:
          type: boolean
          example: false
    ErrorDto:
      type: object
      required:
        - timestamp
        - status
        - error
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-22T10:41:29.469Z"
        status:
          type: integer
          format: int32
          example: 500
        error:
          type: string
          example: Internal Server Error
        path:
          type: string
          example: "/v1/users"