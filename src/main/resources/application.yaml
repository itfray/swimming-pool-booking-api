server.port: ${SERVER_PORT:8080}

spring:
  application:
    name: swimming-pool-booking-api
  devtools:
    add-properties: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-prod.xml
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      max-lifetime: 300000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

management:
  server.port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    access:
      default: read_only
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
    probes:
      enabled: true
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState, db, diskSpace

logging:
  level:
    root: INFO
    pro.itfray: INFO
