server.port: ${SERVER_PORT:8080}

spring:
  application:
    name: swimming-pool-booking-api
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-prod.xml
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      max-lifetime: 300000
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:pool-booking-api}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}

management:
  server.port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    access:
      default: read_only
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
    probes:
      enabled: true
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState, db, diskSpace

logging:
  level:
    root: INFO
    pro.itfray: INFO
